<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    DirectoryIndex index.php

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride FileInfo Options
        Require all granted
    </Directory>

    <FilesMatch "\.(?:env|log|sql|sqlite|lock|bak)$">
        Require all denied
    </FilesMatch>

    # Pengecualian sempit: viewer laravel-brain memuat graph dari /_laravel-brain/.graph-*.json.
    <LocationMatch "^(?!/_laravel-brain/\.graph-[a-z0-9_-]+\.json$).*/\.(?!well-known(?:/|$))">
        Require all denied
    </LocationMatch>

    <LocationMatch "^/build/">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    LimitRequestBody 10485760

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
